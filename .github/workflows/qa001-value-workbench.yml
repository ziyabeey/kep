name: KEP-QA-001 isolated mutation audit (temporary experiment only)

on:
  push:
    branches: [research/qa-001-mutation-test-value]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: labs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check prespecified fault campaign, no live data
        run: python scripts/audit_test_value.py --protocol
      - name: Test fault detection only in temporary offline copies
        run: python scripts/audit_test_value.py --output "$RUNNER_TEMP/qa001-${{ matrix.python-version }}.json"
      - name: Preserve mutation scorecard and runtime (aggregate only)
        uses: actions/upload-artifact@v4
        with:
          name: qa001-value-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/qa001-${{ matrix.python-version }}.json
          retention-days: 7
          if-no-files-found: error
