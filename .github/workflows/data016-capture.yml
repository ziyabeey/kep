name: DATA-016 isolated public patch projection capture
on:
  push:
    branches: [research/data-016-patch-event-alias-evidence]
    paths: [.github/workflows/data016-capture.yml]
permissions:
  contents: read
jobs:
  scoped-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline regression gate before source access
        working-directory: labs/core
        run: |
          python -m unittest tests.test_gers_patch_pair tests.test_gers_patch_access tests.test_gers_probe_contracts tests.test_gers_probe_transport -q
          python scripts/review_gers_region_events.py --check > /dev/null
          python scripts/review_gers_footer.py --check > /dev/null
      - name: Install optional pinned Parquet reader, outside source-body measurement
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Explicit single scoped source read, maximum 16 MiB
        working-directory: labs/core
        run: |
          python scripts/probe_gers_patch.py --fetch \
            --research-confirmation PATCH_REGIONAL_EQUIVALENCE_16MIB \
            --output "$RUNNER_TEMP/data016"
      - name: Preserve only aggregate research receipt, including incomplete failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data016-scoped-research-receipt
          path: ${{ runner.temp }}/data016/research_receipt.json
          if-no-files-found: warn
          retention-days: 7
