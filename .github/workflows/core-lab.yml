name: KEP Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: labs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile lab
        run: python -m compileall -q kepcore benchmarks tests scripts
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Radar offline and policy smoke
        run: |
          python scripts/poll_source.py --list
          python scripts/poll_source.py --source izmir_open_events
          python scripts/poll_source.py --source zorlu_psm_events
          python scripts/haiku_browser_scout.py --source zorlu_psm_events
          python -m benchmarks.scout_eval
      - name: Scientific evidence-value lab (offline, synthetic)
        run: |
          python scripts/research_intelligence.py > /dev/null
          python -m benchmarks.evidence_value > /dev/null
      - name: Temporal source calibration (offline, synthetic)
        run: python -m benchmarks.calibration_eval > /dev/null
      - name: Human review intake CLI contract (offline)
        run: python scripts/intake_human_reviews.py --help > /dev/null
      - name: Randomized source audit bias lab (offline, synthetic)
        run: |
          python -m benchmarks.audit_bias_eval > /dev/null
          python scripts/audit_source_reliability.py --help > /dev/null
      - name: Overture Places v2 schema and unbiased pilot (offline synthetic)
        run: |
          python -m benchmarks.overture_places_eval
          python scripts/overture_istanbul.py
      - name: Overture artifact integrity and existence audit (offline, synthetic)
        run: |
          python scripts/verify_overture_pilot.py --help > /dev/null
          python -m benchmarks.overture_audit_eval > /dev/null
      - name: Verify pinned REAL Overture POI archive (offline, non-publishing)
        run: python scripts/real_overture_replay.py > /dev/null
      - name: Blind Overture field-review intake (offline, no human labels)
        run: python scripts/intake_overture_field_workbooks.py --help > /dev/null
      - name: Blind third-review and disjoint holdout contract (offline)
        run: python scripts/adjudicate_overture_field.py --help > /dev/null
      - name: Overture time-aware source delta (real reference + synthetic later edits)
        run: |
          python -m benchmarks.overture_delta_eval > /dev/null
          python scripts/overture_release_delta.py > /dev/null
      - name: Overture historical S3 object preflight (offline, mock transport)
        run: |
          python -m unittest tests.test_overture_historical_probe -q
          python scripts/overture_august_legacy.py > /dev/null
      - name: Reproduce offline benchmarks
        run: python run_all.py

      - name: Empirical supplier drift and private triage contract (offline)
        run: |
          python -m unittest tests.test_overture_change_triage -q
          python scripts/overture_confidence_drift.py > /dev/null

      - name: Freeze-check original real August ZIP and September replay (offline)
        run: python scripts/replay_pinned_august.py > /dev/null

      - name: GERS compatibility and measured real replay (offline, no official events invented)
        run: python scripts/reconcile_gers_releases.py --check --benchmark > "$RUNNER_TEMP/data013-${{ matrix.python-version }}.json"
      - name: Preserve aggregate DATA-013 CI measurements (no queues or reviewer files)
        uses: actions/upload-artifact@v4
        with:
          name: data013-replay-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/data013-${{ matrix.python-version }}.json
          retention-days: 7
          if-no-files-found: error
