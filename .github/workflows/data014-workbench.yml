name: DATA-014 isolated research workbench
on:
  push:
    branches: [research/data-014-gers-footer-cost]
    paths: [.github/workflows/data014-workbench.yml]
permissions:
  contents: write
jobs:
  metadata-capture:
    if: >-
      github.event.head_commit.message == 'experiment(data-014): authorize one bounded metadata-only capture'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline regression gate before any source access
        working-directory: labs/core
        run: python -m unittest tests.test_gers_access_cost tests.test_gers_footer_transport -v
      - name: Install optional pinned metadata reader (not part of source-body budget)
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Explicitly scoped public metadata experiment, maximum 16 MiB
        working-directory: labs/core
        run: python scripts/gers_footer_study.py --fetch --research-confirmation METADATA_ONLY_16MIB --output "$RUNNER_TEMP/gers-footer"
      - name: Preserve only verified metadata and derived cost report on research branch
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import shutil, os
          root=Path('labs/core')
          src=Path(os.environ['RUNNER_TEMP'])/'gers-footer/footers.zip'
          dest=root/'data/real/gers_footer_2026-10-11/footers.zip'
          if dest.exists(): raise SystemExit('Do not overwrite a prior capture')
          dest.parent.mkdir(parents=True)
          shutil.copyfile(src,dest)
          p=root/'kepcore/gers_access_cost.py'
          text=p.read_text(); old='PINNED_ZIP_SHA256 = None  # Set only after an actual capture and independent byte check.'
          if text.count(old)!=1: raise SystemExit('Unexpected pin state')
          p.write_text(text.replace(old,'PINNED_ZIP_SHA256 = '+repr(sha256(src.read_bytes()).hexdigest())))
          PY
          cd labs/core
          python scripts/gers_footer_study.py --replay > reports/KEP_DATA_014_FOOTER_RESULTS.json
          cd ../..
          git config user.name 'KEP Research Workbench'
          git config user.email 'research@users.noreply.github.com'
          git add labs/core/data/real/gers_footer_2026-10-11/footers.zip labs/core/kepcore/gers_access_cost.py labs/core/reports/KEP_DATA_014_FOOTER_RESULTS.json
          git commit -m 'data(data-014): preserve actual GERS footers and metadata-only cost measurement'
          git push origin HEAD:research/data-014-gers-footer-cost
      - name: Export tracked implementation and captured evidence for independent byte checks
        if: always()
        run: git archive --format=zip HEAD > "$RUNNER_TEMP/source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data014-metadata-evidence
          path: |
            ${{ runner.temp }}/gers-footer/
            ${{ runner.temp }}/source.zip
          retention-days: 7
          if-no-files-found: error
