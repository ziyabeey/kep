name: DATA-013 one-shot tested patch authoring

# Temporary authoring workbench, removed through connector before merge.
# This job performs NO external research download and only writes this feature branch.
on:
  push:
    branches: [research/data-013-gers-changelog-validation]
permissions:
  contents: write
jobs:
  author:
    if: github.repository == 'ziyabeey/kep' && contains(github.event.head_commit.message, '[data013-materialize]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact patch bytes and explicitly scoped paths before applying
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, io, pathlib, subprocess
          parts=[pathlib.Path(f'.github/data013_part{i}.b64').read_text().strip() for i in range(5)]
          # Recover one identified repeated transport segment; the final SHA remains mandatory.
          if len(parts[3])!=10000:
              start=parts[3].index('H3Of8+')+6
              end=parts[3].index('JR20uSOIpOgu9ZhBcV+mZS86pnUdX2chJy0ax5CdrIv4ZKwr8LzhS3271K36Ox/PjNm')
              if not start<end:
                  raise ValueError('Unexpected transport corruption')
              parts[3]=parts[3][:start]+parts[3][end:]
          if list(map(len,parts))!=[10000,10000,10000,10000,336]:
              raise ValueError('Transport part length mismatch')
          packed=base64.b64decode(''.join(parts),validate=True)
          if hashlib.sha256(packed).hexdigest()!='14f23a0c3ccd172e2d4749836dfdd596451eada5c9d327a6491532216872e7b5':
              raise ValueError('Exact locally tested patch checksum mismatch')
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              patch=stream.read(200001)
          if len(patch)>200000:
              raise ValueError('Expanded patch too large')
          target=pathlib.Path('/tmp/data013.patch');target.write_bytes(patch)
          allowed={
              'README.md','docs/adr/0019-gers-source-reconciliation.md',
              'labs/core/DATA_LICENSES.md','labs/core/README.md',
              'labs/core/benchmarks/gers_reconciliation_eval.py',
              'labs/core/data/real/gers_access_2026-10-11/2026-09-23.0.catalog.json',
              'labs/core/data/real/gers_access_2026-10-11/2026-09-23.1.catalog.json',
              'labs/core/data/real/gers_access_2026-10-11/capture_attempt.json.gz',
              'labs/core/docs/GERS_RECONCILIATION.md',
              'labs/core/kepcore/gers_reconciliation.py',
              'labs/core/reports/KEP_DATA_013_REAL_RESULTS.json',
              'labs/core/scripts/capture_gers_chain_manual.py',
              'labs/core/scripts/reconcile_gers_releases.py',
              'labs/core/tests/test_gers_guards.py',
              'labs/core/tests/test_gers_real_replay.py',
              'labs/core/tests/test_gers_reconciliation.py'}
          stats=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          paths={line.split('\t',2)[2] for line in stats.splitlines()}
          if paths!=allowed:
              raise ValueError('Patch path allowlist mismatch')
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          for i in range(5):
              subprocess.run(['git','rm',f'.github/data013_part{i}.b64'],check=True)
          original=pathlib.Path('labs/core/data/real/overture_istanbul_2026-08-19.0/original_actions_artifact.zip').read_bytes()
          assert hashlib.sha256(original).hexdigest()=='cb9ee86c128b4839a00722e1b192f460691c0f33e358f0b0b9ae458ea403ef05'
          print('Verified and applied 16 scoped files; preserved exact original August ZIP.')
          PY
      - name: Complete offline regression suite before committing
        working-directory: labs/core
        run: |
          python -m compileall -q kepcore benchmarks tests scripts
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/data013-authoring-tests.txt
          python scripts/reconcile_gers_releases.py --check > /tmp/data013-authoring-report.json
      - name: Commit only verified scoped changes to feature branch, never main
        run: |
          test "$GITHUB_REF" = 'refs/heads/research/data-013-gers-changelog-validation'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(data-013): add scientifically gated GERS reconciliation and pinned access evidence'
          git push origin HEAD:refs/heads/research/data-013-gers-changelog-validation
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data013-authoring-proof
          path: |
            /tmp/data013-authoring-tests.txt
            /tmp/data013-authoring-report.json
            .github/data013_part*.b64
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error
