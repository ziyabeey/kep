name: DATA-013 one-shot bounded changelog capture

# Temporary, explicit research invocation. Remove before merging.
on:
  push:
    branches: [research/data-013-gers-changelog-validation]
permissions:
  contents: read
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[gers-chain-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated optional acquisition dependency, same pin as historical research
        run: python -m pip install --disable-pip-version-check 'duckdb==1.4.1'
      - name: Public changelog only; hard 256 MiB body budget; no August Places download
        run: |
          python labs/core/scripts/capture_gers_chain_manual.py --fetch --research-confirmation RESEARCH_ONLY --output /tmp/data013-chain
          git archive --format=tar HEAD > /tmp/data013-chain/workbench.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data013-official-chain
          path: /tmp/data013-chain/
          retention-days: 2
          if-no-files-found: error
