name: KEP DATA-012 one-shot pinned August archive preservation

on:
  push:
    branches:
      - research/data-012-preserve-august-archive

permissions:
  contents: write

concurrency:
  group: kep-preserve-august-2026-original-once
  cancel-in-progress: false

jobs:
  preserve:
    if: github.repository == 'ziyabeey/kep' && github.ref == 'refs/heads/research/data-012-preserve-august-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Download exactly one original, pinned research artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ziyabeey/kep/actions/artifacts/11695042455/zip" \
            --output "${RUNNER_TEMP}/kep-original-august.zip"
      - name: Verify all archive bytes and research-only rights
        env:
          ORIGINAL_ZIP: ${{ runner.temp }}/kep-original-august.zip
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          p=pathlib.Path(os.environ["ORIGINAL_ZIP"])
          EXPECTED_ZIP="cb9ee86c128b4839a00722e1b192f460691c0f33e358f0b0b9ae458ea403ef05"
          EXPECTED={
            "places_minimal.json":"ba22c8d7e52c7d6e7067fb67b16e623932dfbbf301b28bf55dd8d9e0e07a1664",
            "manifest.json":"7b291e03f37782be5657b99ef700411dd238cad57ce233c6b9502cf68903ca90",
            "historical_public_preflight.json":"6bb806047899cdf92d24d7d281ce2dd6464ab67c3fba63f6d39a2ac7da976bb4",
            "source_delta_provisional.json":"a972bcd04aa01c70cf46a60a9c399104fa9d5238dbea41daff2ea0114de544ce",
          }
          raw=p.read_bytes()
          if len(raw)>1_000_000 or hashlib.sha256(raw).hexdigest()!=EXPECTED_ZIP:
            raise SystemExit("Original GitHub archive checksum or size changed")
          with zipfile.ZipFile(p) as z:
            infos=z.infolist()
            if len(infos)!=4 or {i.filename for i in infos}!=set(EXPECTED) or sum(i.file_size for i in infos)>4_000_000:
              raise SystemExit("Archive members unexpected")
            data={i.filename:z.read(i) for i in infos}
          for name,sha in EXPECTED.items():
            if hashlib.sha256(data[name]).hexdigest()!=sha:
              raise SystemExit("Original member differs: "+name)
          doc=json.loads(data["places_minimal.json"])
          manifest=json.loads(data["manifest.json"])
          receipt=json.loads(data["historical_public_preflight.json"])
          if (doc.get("release")!="2026-08-19.0" or len(doc.get("records",[]))!=4650 or
              manifest.get("source_release")!="2026-08-19.0" or
              manifest.get("consumer_publish") is not False or
              manifest.get("consumer_display_approved") is not False or
              manifest.get("acquisition",{}).get("method")!="historical_duckdb_public_s3" or
              manifest.get("acquisition",{}).get("upstream_authenticated_independently") is not False or
              receipt.get("one_parquet_head_verified") is not True or
              receipt.get("all_release_parts_verified") is not False):
            raise SystemExit("Pinned release, origin or research-only flags changed")
          print("Verified 4,650 source records, original GitHub ZIP SHA and all four members.")
          PY
      - name: Commit original minimized archive, remove one-time workflow
        env:
          ORIGINAL_ZIP: ${{ runner.temp }}/kep-original-august.zip
        shell: bash
        run: |
          set -euo pipefail
          archive="labs/core/data/real/overture_istanbul_2026-08-19.0/original_actions_artifact.zip"
          if [ -e "$archive" ]; then
            echo "Frozen archive path already exists; refuse to overwrite"
            exit 1
          fi
          mkdir -p "$(dirname "$archive")"
          cp "$ORIGINAL_ZIP" "$archive"
          git rm --quiet -- .github/workflows/preserve-august-once.yml
          git add -f -- "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: preserve pinned August 2026 Overture source archive"
          git push origin HEAD:refs/heads/research/data-012-preserve-august-archive
          echo "One-time workflow removed after successful archival."
