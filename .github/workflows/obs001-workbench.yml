name: KEP OBS-001 observable signal feasibility workbench (temporary)

on:
  push:
    branches: [research/obs-001-audit-signal-value]

permissions:
  contents: read

concurrency:
  group: obs001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-signal-study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    defaults:
      run:
        working-directory: labs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check preregistered observable-only contracts (no test truth)
        run: python -m unittest tests.test_observable_signal_eval -v
      - name: Run first locked synthetic 960-case holdout
        run: python -m benchmarks.observable_signal_eval > "$RUNNER_TEMP/obs001-${{ matrix.python-version }}.json"
      - name: Preserve only aggregate test-value report
        uses: actions/upload-artifact@v4
        with:
          name: obs001-synthetic-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/obs001-${{ matrix.python-version }}.json
          retention-days: 7
          if-no-files-found: error
