name: DATA-015 isolated code delivery
on:
  push:
    branches: [research/data-015-regional-gers-events]
    paths: ['.github/workflows/data015-workbench.yml']
permissions:
  contents: write
jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize precisely reviewed research text files
        run: |
          python - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          compressed=""
          raw=zlib.decompress(base64.b64decode(compressed))
          assert hashlib.sha256(raw).hexdigest()=="3877283847e348de363ec13774a7a6f1c588140739c63c49dbaa518f8782ce7d"
          files=json.loads(raw)
          permitted=["labs/core/kepcore/gers_region_probe.py","labs/core/scripts/probe_gers_region.py","labs/core/tests/test_gers_probe_contracts.py","labs/core/tests/test_gers_probe_real.py","labs/core/tests/test_gers_probe_transport.py","labs/core/docs/GERS_REGIONAL_EVENT_PROBE.md","docs/adr/0021-gers-regional-event-probe.md","labs/core/reports/KEP_DATA_015_PREFLIGHT.json"]
          assert set(files)==set(permitted)
          for name,body in files.items():
              assert isinstance(body,str) and len(body)<40000
              p=Path(name)
              assert not p.exists() and not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(body,encoding='utf-8')
          print("Staged",len(files),"strictly allowlisted research source files")
          PY
      - name: Run complete existing and DATA-015 offline tests
        working-directory: labs/core
        run: |
          python -m compileall -q kepcore tests scripts
          python -m unittest tests.test_gers_probe_contracts tests.test_gers_probe_real tests.test_gers_probe_transport -v
          python scripts/probe_gers_region.py
          python scripts/review_gers_footer.py --check > /dev/null
          python -m unittest discover -s tests -q
      - name: Commit only the reviewed research change set
        run: |
          git config user.name "KEP Research Workbench"
          git config user.email "research@users.noreply.github.com"
          git add "labs/core/kepcore/gers_region_probe.py" "labs/core/scripts/probe_gers_region.py" "labs/core/tests/test_gers_probe_contracts.py" "labs/core/tests/test_gers_probe_real.py" "labs/core/tests/test_gers_probe_transport.py" "labs/core/docs/GERS_REGIONAL_EVENT_PROBE.md" "docs/adr/0021-gers-regional-event-probe.md" "labs/core/reports/KEP_DATA_015_PREFLIGHT.json"
          git diff --cached --check
          git commit -m "feat(data-015): scoped publisher provenance and bounded regional GERS observation"
          git push origin HEAD:refs/heads/research/data-015-regional-gers-events
