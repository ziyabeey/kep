name: DATA-015 bounded regional event source read (isolated research only)
on:
  push:
    branches: [research/data-015-regional-gers-events]
    paths: ['.github/workflows/data015-workbench.yml']
permissions:
  contents: write
jobs:
  regional:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline regression and metadata preflight before network
        working-directory: labs/core
        run: |
          python -m unittest tests.test_gers_probe_contracts tests.test_gers_probe_real tests.test_gers_probe_transport -v
          python scripts/review_gers_footer.py --check > /dev/null
      - name: Install pinned optional reader, outside source-body budget
        run: python -m pip install --disable-pip-version-check --only-binary=:all: pyarrow==21.0.0
      - name: One explicitly scoped public GERS read, fixed 16 MiB body cap
        working-directory: labs/core
        run: |
          python scripts/probe_gers_region.py --fetch --research-confirmation REGIONAL_MEMBERSHIP_16MIB --output "$RUNNER_TEMP/gers-region-observation"
      - name: Archive public aggregate or incomplete failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data015-research-receipt
          path: ${{ runner.temp }}/gers-region-observation/research_receipt.json
          retention-days: 7
          if-no-files-found: warn
      - name: Verify no raw rows or business claims, commit aggregate only to research branch
        working-directory: labs/core
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'gers-region-observation/research_receipt.json'
          x=json.loads(p.read_text())
          assert x['status']=='REGIONAL_OBSERVATIONS_CAPTURED_NOT_COMPLETE_ID_UNION'
          assert x['complete_for_all_union_ids'] is False
          assert x['official_membership_agreement_fraction'] is None
          assert x['physical_business_openings'] is None and x['physical_business_closures'] is None
          assert x['consumer_publish'] is False
          assert x['data_page_response_bytes']<=16*1024*1024
          assert x['request_count']<=128
          assert x['aggregate']['origin']=='captured_public_GERS_rows'
          assert x['aggregate']['safe_to_reconcile_membership'] is False
          assert all('id' not in k.lower() or k in {'source_metadata_zip_sha256'} for k in x)
          target=Path('reports/KEP_DATA_015_REGIONAL_EVENTS.json')
          assert not target.exists()
          target.write_bytes(p.read_bytes())
          print('Aggregate-only, region-only receipt preserved')
          PY
          git config user.name "KEP Research Workbench"
          git config user.email "research@users.noreply.github.com"
          git add reports/KEP_DATA_015_REGIONAL_EVENTS.json
          git diff --cached --check
          git commit -m "data(data-015): preserve bounded real regional membership observations"
          git push origin HEAD:refs/heads/research/data-015-regional-gers-events
