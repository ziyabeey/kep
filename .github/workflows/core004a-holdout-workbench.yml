name: KEP CORE-004A preregistered synthetic outage holdout (temporary)

on:
  push:
    branches: [research/core-004-outage-value-gate]

permissions:
  contents: read

concurrency:
  group: core004a-holdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: labs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Guard exact fixed protocol and local one-step contracts
        run: python -m unittest tests.test_outage_grace tests.test_outage_value_eval -v
      - name: Evaluate FIRST held-out 1080 fictional cases without external network
        run: python -m benchmarks.outage_value_eval > "$RUNNER_TEMP/core004a-${{ matrix.python-version }}.json"
      - name: Preserve only aggregate synthetic GO or NO_GO evidence
        uses: actions/upload-artifact@v4
        with:
          name: core004a-first-holdout-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/core004a-${{ matrix.python-version }}.json
          retention-days: 7
          if-no-files-found: error
